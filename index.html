<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKURA CLOCK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        :root {
            --neon-pink: #ff00aa;
            --neon-cyan: #00ffff;
            --neon-purple: #aa00ff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background: #0a001a;
            color: #ffccff;
            font-family: 'Press Start 2P', system-ui;
            height: 100vh;
            width: 100vw;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .header {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 6px;
        }
        
        .header h1 {
            font-size: 2.8rem;
            font-weight: 400;
            background: linear-gradient(90deg, #ff00cc, #00ffff, #ff00cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 0 10px #ff00cc,
                0 0 20px #ff00cc,
                0 0 40px #00ffff;
            margin-bottom: 8px;
            animation: title-glow 3s ease-in-out infinite alternate;
        }
        
        .header .subtitle {
            font-size: 0.9rem;
            color: #aaffff;
            text-shadow: 0 0 15px #00ffff;
            letter-spacing: 8px;
            opacity: 0.9;
        }
        
        .footer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #ff88cc;
            text-shadow: 0 0 10px #ff00aa;
            z-index: 10;
            opacity: 0.6;
            letter-spacing: 3px;
        }
        
        @keyframes title-glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }
        
        .petal {
            position: absolute;
            font-size: 18px;
            pointer-events: none;
            z-index: 3;
            animation: fall linear infinite;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="overlay">
        <div class="header">
            <h1>SAKURA</h1>
            <div class="subtitle">N E O N • 時計</div>
        </div>
        
        <div class="footer">
            ANIME TIMEKEEPER
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        let width = 0;
        let height = 0;
        let cx = 0;
        let cy = 0;
        let radius = 0;
        
        let petals = [];
        let time = { h: 0, m: 0, s: 0 };
        
        class Petal {
            constructor() {
                this.reset(true);
            }
            
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : Math.random() * -height * 0.4 - 50;
                this.size = Math.random() * 22 + 14;
                this.speed = Math.random() * 1.8 + 0.8;
                this.angle = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.025 + 0.008;
                this.wobbleAmount = Math.random() * 35 + 18;
                this.opacity = Math.random() * 0.5 + 0.45;
                this.hueOffset = Math.random() * 35 - 10;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.045;
            }
            
            update() {
                this.y += this.speed;
                this.angle += this.wobbleSpeed;
                this.x += Math.sin(this.angle) * 1.8;
                this.rotation += this.rotationSpeed;
                
                // Gentle horizontal wind
                this.x += Math.sin(Date.now() / 1800) * 0.6;
                
                if (this.y > height + 100) {
                    this.reset();
                }
                
                // Occasionally reset if too far left or right
                if (this.x < -100 || this.x > width + 100) {
                    this.x = Math.random() * width;
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.font = `${this.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const color = `hsla(${330 + this.hueOffset}, 95%, 82%, ${this.opacity})`;
                ctx.fillStyle = color;
                
                // Glow for petals
                ctx.shadowColor = `hsla(${340 + this.hueOffset}, 100%, 75%, 0.9)`;
                ctx.shadowBlur = 12;
                
                ctx.fillText('❀', 0, 0);
                ctx.restore();
            }
        }
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            cx = width / 2;
            cy = height / 2;
            radius = Math.min(width, height) * 0.32;
            
            // Reinitialize some petals on resize
            if (petals.length > 0) {
                petals.forEach(p => {
                    if (Math.random() > 0.6) p.reset();
                });
            }
        }
        
        function drawBackground() {
            // Deep anime night gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height * 0.85);
            grad.addColorStop(0, '#1a0033');
            grad.addColorStop(0.5, '#0f0022');
            grad.addColorStop(1, '#220011');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            
            // Subtle radial glow in center
            const centerGlow = ctx.createRadialGradient(
                cx, cy * 0.9, radius * 1.6, 
                cx, cy * 0.95, radius * 3.2
            );
            centerGlow.addColorStop(0, 'rgba(180, 30, 180, 0.13)');
            centerGlow.addColorStop(1, 'rgba(40, 0, 120, 0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, width, height);
            
            // Very faint horizontal light band
            ctx.fillStyle = 'rgba(255, 200, 255, 0.03)';
            ctx.fillRect(0, height * 0.35, width, height * 0.2);
        }
        
        function drawClockFace() {
            const r = radius;
            
            // Ultra outer neon halo
            ctx.shadowColor = '#ff22dd';
            ctx.shadowBlur = 65;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 1.22, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 60, 220, 0.25)';
            ctx.lineWidth = 42;
            ctx.stroke();
            
            // Main outer ring
            ctx.shadowColor = '#ff00cc';
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 1.13, 0, Math.PI * 2);
            ctx.strokeStyle = '#ff99ee';
            ctx.lineWidth = 18;
            ctx.stroke();
            
            // Inner metallic ring
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#00eeff';
            ctx.beginPath();
            ctx.arc(cx, cy, r * 1.05, 0, Math.PI * 2);
            ctx.strokeStyle = '#bbddff';
            ctx.lineWidth = 9;
            ctx.stroke();
            
            // Face background
            const faceGradient = ctx.createRadialGradient(
                cx - r * 0.3, cy - r * 0.35, r * 0.2,
                cx, cy, r * 1.08
            );
            faceGradient.addColorStop(0, '#2a1a44');
            faceGradient.addColorStop(1, '#110822');
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = faceGradient;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            
            // Inner subtle pattern ring
            ctx.strokeStyle = 'rgba(255, 180, 240, 0.15)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2);
            ctx.stroke();
            
            // Tick marks
            ctx.shadowBlur = 12;
            const tickCount = 60;
            
            for (let i = 0; i < tickCount; i++) {
                const angle = (i * Math.PI * 2) / tickCount - (Math.PI / 2);
                const isMajor = i % 5 === 0;
                const tickLength = isMajor ? 32 : 14;
                const innerRadius = r * (isMajor ? 0.82 : 0.88);
                
                const x1 = cx + Math.cos(angle) * innerRadius;
                const y1 = cy + Math.sin(angle) * innerRadius;
                const x2 = cx + Math.cos(angle) * (innerRadius - tickLength);
                const y2 = cy + Math.sin(angle) * (innerRadius - tickLength);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                
                if (isMajor) {
                    ctx.strokeStyle = '#ffddff';
                    ctx.lineWidth = 7.5;
                    ctx.shadowColor = '#ff77dd';
                } else {
                    ctx.strokeStyle = '#ccbbff';
                    ctx.lineWidth = 3.5;
                    ctx.shadowColor = '#9988dd';
                }
                ctx.stroke();
            }
            
            // Numbers
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#ff99ff';
            ctx.fillStyle = '#ffeeff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const numRadius = r * 0.68;
            
            for (let i = 1; i <= 12; i++) {
                const numAngle = (i * Math.PI / 6) - (Math.PI / 2);
                const numX = cx + Math.cos(numAngle) * numRadius;
                const numY = cy + Math.sin(numAngle) * numRadius;
                
                ctx.font = `900 ${Math.round(r / 9.5)}px "Press Start 2P"`;
                ctx.fillText(i.toString(), numX, numY + (r > 300 ? 4 : 2));
            }
            
            // Center cherry blossom accent
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff66bb';
            ctx.font = `${Math.round(r / 5.5)}px serif`;
            ctx.fillStyle = 'rgba(255, 110, 190, 0.25)';
            ctx.fillText('❀', cx, cy);
        }
        
        function drawHands() {
            const now = new Date();
            let hours = now.getHours() % 12;
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ms = now.getMilliseconds();
            
            // Precise angles
            const secondAngle = ((seconds * 1000 + ms) / 60000) * Math.PI * 2 - Math.PI / 2;
            const minuteAngle = (minutes + seconds / 60) / 60 * Math.PI * 2 - Math.PI / 2;
            const hourAngle = (hours + minutes / 60) / 12 * Math.PI * 2 - Math.PI / 2;
            
            const r = radius;
            
            // HOUR HAND
            const hourLength = r * 0.52;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#cc33ff';
            
            ctx.strokeStyle = '#dd88ff';
            ctx.lineWidth = Math.max(13, r / 22);
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(hourAngle) * hourLength,
                cy + Math.sin(hourAngle) * hourLength
            );
            ctx.stroke();
            
            // MINUTE HAND
            const minLength = r * 0.78;
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#22ffff';
            
            ctx.strokeStyle = '#66ffff';
            ctx.lineWidth = Math.max(9, r / 29);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(minuteAngle) * minLength,
                cy + Math.sin(minuteAngle) * minLength
            );
            ctx.stroke();
            
            // SECOND HAND
            const secLength = r * 0.87;
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ff2288';
            
            ctx.strokeStyle = '#ff5599';
            ctx.lineWidth = Math.max(4, r / 55);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(secondAngle) * secLength,
                cy + Math.sin(secondAngle) * secLength
            );
            ctx.stroke();
            
            // Tiny tail for second hand
            ctx.shadowBlur = 8;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(secondAngle + Math.PI) * (r * 0.18),
                cy + Math.sin(secondAngle + Math.PI) * (r * 0.18)
            );
            ctx.stroke();
            
            // Center bolt
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#1f0a33';
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff66dd';
            ctx.fillStyle = '#ffccff';
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.055, 0, Math.PI * 2);
            ctx.fill();
            
            // Innermost dot
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#330022';
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.02, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function updateClock() {
            const now = new Date();
            time.h = now.getHours();
            time.m = now.getMinutes();
            time.s = now.getSeconds();
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawBackground();
            
            // Update and draw petals
            for (let i = 0; i < petals.length; i++) {
                petals[i].update();
                petals[i].draw();
            }
            
            drawClockFace();
            drawHands();
            
            // Occasional extra glow pulse on center
            if (Math.random() > 0.96) {
                ctx.shadowBlur = 45;
                ctx.shadowColor = '#ff88ee';
                ctx.strokeStyle = 'rgba(255, 200, 240, 0.2)';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.24, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            updateClock();
            requestAnimationFrame(animate);
        }
        
        function initPetals(count) {
            petals = [];
            for (let i = 0; i < count; i++) {
                petals.push(new Petal());
            }
        }
        
        function initialize() {
            resize();
            initPetals(68);
            updateClock();
            animate();
        }
        
        window.addEventListener('resize', () => {
            resize();
        });
        
        // Keyboard shortcut for fun (press R to reset petals)
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r') {
                initPetals(68);
            }
        });
        
        // Boot app
        window.onload = initialize;
    </script>
</body>
</html>
