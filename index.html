<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桜の時計</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-rose-50 via-pink-50 to-purple-50 flex items-center justify-center overflow-hidden">
        <div class="relative z-10 flex flex-col items-center">
            <!-- Header -->
            <div class="mb-8 text-center">
                <h1 class="text-6xl font-light tracking-[0.5em] text-rose-700/90" style="font-family: 'Noto Serif JP', serif;">桜の時計</h1>
                <div class="h-px w-48 mx-auto bg-gradient-to-r from-transparent via-rose-300 to-transparent mt-3"></div>
                <p class="text-rose-400 text-sm mt-4 tracking-widest">SAKURA CLOCK</p>
            </div>
            
            <!-- Clock container -->
            <div class="relative shadow-2xl" style="width: 420px; height: 420px;">
                <!-- Clock canvas -->
                <canvas 
                    id="clock" 
                    width="400" 
                    height="400"
                    class="bg-white rounded-full border-8 border-white shadow-inner">
                </canvas>
                
                <!-- Falling petals overlay -->
                <div id="petals-overlay" 
                     class="absolute top-0 left-0 w-full h-full rounded-full pointer-events-none overflow-hidden z-20">
                </div>
                
                <!-- Subtle inner glow -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] h-[380px] rounded-full border border-white/40 pointer-events-none z-10"></div>
            </div>
            
            <!-- Footer message -->
            <div class="mt-10 flex items-center gap-x-6 text-rose-300 text-xs tracking-widest">
                <div class="flex-1 h-px bg-gradient-to-r from-transparent to-rose-200"></div>
                <div>花びらと共に時を刻む</div>
                <div class="flex-1 h-px bg-gradient-to-l from-transparent to-rose-200"></div>
            </div>
        </div>
        
        <!-- Background decorative petals (static) -->
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none z-0"
             style="background: radial-gradient(circle at 20% 30%, #fda4af 0%, transparent 50%),
                           radial-gradient(circle at 80% 70%, #f9a8d4 0%, transparent 50%)"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
